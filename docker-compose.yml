version: '3.8'

# Local development database only.
# The backend and frontend have no Dockerfiles — run them directly:
#   cd backend && uvicorn app.main:app --reload --port 8000
#   cd frontend && npm run dev
#
# After starting this container, run: cd backend && alembic upgrade head

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: sentineliq
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
